query Lots($filter: LotsFiltersInput!, $limit: Int, $after: Int) {
  Lots(filter: $filter, limit: $limit, after: $after) {
    id lotNumber refLotStatusId lastUpdateDate count amount
    nameRu nameKz descriptionRu descriptionKz
    customerId customerBin customerNameRu customerNameKz
    trdBuyNumberAnno trdBuyId dumping refTradeMethodsId
    refBuyTradeMethodsId pointList enstruList plnPointKatoList
    isDeleted systemId indexDate
    TrdBuy { publishDate }
  }
}
