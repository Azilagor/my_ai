query Announcements($filter: TrdBuyFiltersInput!, $limit: Int, $after: Int) {
  TrdBuy(filter: $filter, limit: $limit, after: $after) {
    id numberAnno nameRu nameKz totalSum countLots
    refTradeMethodsId refSubjectTypeId customerBin customerPid
    customerNameRu customerNameKz orgBin orgPid orgNameRu orgNameKz
    refBuyStatusId startDate endDate publishDate itogiDatePublic
    refTypeTradeId biinSupplier parentId singlOrgSign
    isLightIndustry isConstructionWork lastUpdateDate finYear kato
    systemId indexDate
    RefTradeMethods { id nameRu nameKz code symbolCode isActive }
    RefSubjectType { id nameRu nameKz }
    RefBuyStatus { id nameRu nameKz code }
    RefTypeTrade { id nameRu nameKz refTradeMethodId }
  }
}
